<html lang="es"> <!-- Define el idioma principal de la página (Español) -->
<head>

    <!-- Ajusta la vista para que la página sea responsiva en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que se muestra en la pestaña del navegador -->
    <title>Menú Vertical</title>

    <!-- Vincula la hoja de estilos externa CSS al documento HTML -->
    <link rel="stylesheet" href="E9_estilos.css">
</head>
<body>

    <!-- Contenedor principal de navegación con la clase 'menu' -->
    <nav class="menu">
        <!-- Enlaces del menú principal -->
        <a href="#">Inicio</a>
        <a href="#">Nosotros</a>
        <a href="#">Productos</a>
        <a href="#">Servicios</a>
        <a href="#">Contacto</a>
    </nav>

</html>
